<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./script.js"></script>
  </head>
  <body>
    <form id="form" class="flex flex-col border border-pink-300 gap-2 p-4">
      <h1>Mock Personal Details</h1>
      <input
        required
        type="text"
        class="border border-slate-100 rounded-lg shadow-sm px-2 py-1"
        placeholder="First name"
      />
      <input
        required
        type="text"
        class="border border-slate-100 rounded-lg shadow-sm px-2 py-1"
        placeholder="Last name"
      />
      <input
        required
        type="text"
        class="border border-slate-100 rounded-lg shadow-sm px-2 py-1"
        placeholder="Age"
      />
      <input
        required
        type="text"
        class="border border-slate-100 rounded-lg shadow-sm px-2 py-1"
        placeholder="Gender"
      />
      <button
        type="submit"
        class="px-2 py-1 rounded-lg shadow-sm bg-green-400 hover:bg-green-500 text-white ease-in-out duration-300"
        id="button"
      >
        Submit
      </button>
    </form>
    <div id="output"></div>
  </body>
</html>
